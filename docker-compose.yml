services:
  db:
    image: pgvector/pgvector:pg16
    container_name: job_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_portal
      POSTGRES_USER: job_portal
      POSTGRES_PASSWORD: job_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_portal -d job_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./job_portal_backend
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: job_portal_backend
    restart: unless-stopped
    env_file:
      - ./job_portal_backend/.env.local
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: django-insecure-local-docker-development-key-change-before-production-2026
      DB_HOST: db
      DB_PORT: "5432"
      QSTASH_URL: http://host.docker.internal:8080
    command: ["dev"]
    ports:
      - "8000:8000"
    volumes:
      - ./job_portal_backend:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./job_portal_frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: job_portal_frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./job_portal_frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  pgdata:
    name: docker_pgdata
  media:
    name: docker_media
  frontend_node_modules:
    name: docker_frontend_node_modules
  frontend_next:
    name: docker_frontend_next
