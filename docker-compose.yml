services:
  db:
    image: pgvector/pgvector:pg16
    container_name: job_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_portal
      POSTGRES_USER: job_portal
      POSTGRES_PASSWORD: job_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_portal -d job_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: docker_pgdata
