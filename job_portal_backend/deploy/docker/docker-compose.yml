services:
  db:
    image: pgvector/pgvector:pg16
    container_name: job_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_portal
      POSTGRES_USER: job_portal
      POSTGRES_PASSWORD: job_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_portal -d job_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: job_portal_backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DB_HOST: db
      DB_PORT: "5432"
    command: ["web"]
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  qcluster:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: job_portal_qcluster
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DB_HOST: db
      DB_PORT: "5432"
    command: ["worker"]
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../../job_portal_frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: job_portal_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
